mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
proxies: []
proxy-groups:
  - name: 'DIRECT-AUTO'
    type: 'url-test'
    proxies: []
    url: 'https://www.google.com/generate_204'
    interval: 300
    tolerance: 100
    lazy: false
    expected-status: 204
  - name: 'PROXY'
    type: 'select'
    proxies:
      - 'DIRECT-AUTO'
      - 'DIRECT'
rules:
  - 'MATCH,PROXY'

mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
  cn_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
proxies:
  - name: '🇮🇹IT_1|625KB/s|R002-260618 01'
    port: 443
    server: '91.243.118.217'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: 'e019d09aa7573606'
  - name: '🇺🇸US_99|810KB/s|R002-260618 01'
    port: 9002
    server: '138.199.35.220'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '6493b98e9afea31a'
  - name: '🇺🇸US_42|776KB/s 01'
    password: ''
    port: 9002
    server: '138.199.35.218'
    skip-cert-verify: true
    tls: true
    type: 'http'
    username: ''
    udp: true
    endpoint-id: '351dcbb70d0afdd5'
proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇮🇹IT_1|625KB/s|R002-260618 01'
      - '🇺🇸US_99|810KB/s|R002-260618 01'
      - '🇺🇸US_42|776KB/s 01'
rules:
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaistatic.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,cn_domain,DIRECT'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'RULE-SET,geolocation_not_cn,PROXY'
  - 'MATCH,PROXY'

mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
  cn_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
proxies:
  - name: '🇸🇬SG_38|247KB/s|R002-260618 01'
    port: 443
    server: '154.26.139.24'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: 'd1f4a0d80288cf0b'
  - name: '🇺🇸US_626|798KB/s|R002-260618 01'
    password: 'null'
    port: 9002
    server: '138.199.35.198'
    skip-cert-verify: true
    sni: '138.199.35.198'
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    username: 'null'
    udp: true
    endpoint-id: 'f8df99716a85628c'
  - name: 'HK香港(mibei77.com 米贝节点分享)_12-source-41447db523bef660'
    type: 'anytls'
    server: '654968169.df6h451rh.xin'
    port: 443
    password: '0324fbc29561'
    skip-cert-verify: true
    tls: true
    udp: true
    client-fingerprint: 'chrome'
    _poolOnly: true
  - name: '🇫🇷FR_183|751KB/s|R002-260618 01'
    port: 443
    server: 'fan.132031.xyz'
    skip-cert-verify: true
    sni: 'fan.132031.xyz'
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: 'eedf278594fece87'
proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
      - '🇺🇸US_626|798KB/s|R002-260618 01'
      - 'HK香港(mibei77.com 米贝节点分享)_12-source-41447db523bef660'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
      - '🇺🇸US_626|798KB/s|R002-260618 01'
      - '🇫🇷FR_183|751KB/s|R002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
rules:
  - 'DOMAIN-SUFFIX,x.com,STICKY'
  - 'DOMAIN-SUFFIX,twitter.com,STICKY'
  - 'DOMAIN-SUFFIX,t.co,STICKY'
  - 'DOMAIN-SUFFIX,threads.com,STICKY'
  - 'DOMAIN-SUFFIX,threads.net,STICKY'
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaistatic.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
  - 'DOMAIN-SUFFIX,pokemonshowdown.com,DIRECT'
  - 'DOMAIN-SUFFIX,psim.us,DIRECT'
  - 'DOMAIN-SUFFIX,services.googleapis.cn,PROXY'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,cn_domain,DIRECT'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'RULE-SET,geolocation_not_cn,PROXY'
  - 'MATCH,PROXY'

      - '🇩🇪DE_163|2.2MB/s|R002-260618 01'
      - '🇳🇱NL_226|3.3MB/s|R002-260618 01'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇳🇱NL_200|4.6MB/s|R002-260618 01'
      - '🇳🇱NL_160|6.6MB/s|R002-260618 01'
      - '🇩🇪DE_197|2.2MB/s|R002-260618 01'

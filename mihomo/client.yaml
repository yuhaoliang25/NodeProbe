mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
  cn_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
proxies:
  - name: '🇷🇴RO_77|720KB/s|R002-260618 01'
    port: 9002
    server: '193.176.84.25'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '43fb51cc32fb89f3'
  - name: '🇷🇴RO_42|1.0MB/s 01'
    port: 9002
    server: '193.176.84.39'
    skip-cert-verify: true
    sni: 'www.bing.com'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '3b375abcd2319a29'
  - name: '🇳🇱NL_47|5.3MB/s|R002-260618 01'
    port: 9002
    server: '84.17.47.148'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '52d842f3e3cb5da5'
  - name: '🇺🇸US_403|775KB/s|R002-260618 01'
    port: 9002
    server: '138.199.35.195'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '472b8b661b6c7482'
  - name: '🇺🇸US_314|857KB/s|R002-260618 01'
    port: 9002
    server: '138.199.35.215'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '4e8e1c3187e3a404'
  - name: '🇸🇬SG_38|247KB/s|R002-260618 01'
    port: 443
    server: '154.26.139.24'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: 'd1f4a0d80288cf0b'
proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇷🇴RO_77|720KB/s|R002-260618 01'
      - '🇷🇴RO_42|1.0MB/s 01'
      - '🇳🇱NL_47|5.3MB/s|R002-260618 01'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇺🇸US_403|775KB/s|R002-260618 01'
      - '🇺🇸US_314|857KB/s|R002-260618 01'
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
rules:
  - 'DOMAIN-SUFFIX,x.com,STICKY'
  - 'DOMAIN-SUFFIX,twitter.com,STICKY'
  - 'DOMAIN-SUFFIX,t.co,STICKY'
  - 'DOMAIN-SUFFIX,threads.com,STICKY'
  - 'DOMAIN-SUFFIX,threads.net,STICKY'
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaistatic.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
  - 'DOMAIN-SUFFIX,pokemonshowdown.com,DIRECT'
  - 'DOMAIN-SUFFIX,psim.us,DIRECT'
  - 'DOMAIN-SUFFIX,services.googleapis.cn,PROXY'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,cn_domain,DIRECT'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'RULE-SET,geolocation_not_cn,PROXY'
  - 'MATCH,PROXY'

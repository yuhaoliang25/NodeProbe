proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇺🇸US_302|830KB/s|P002-260618 01'
      - '🇺🇸US_314|857KB/s|R002-260618 01'
      - '🇺🇸US_442|813KB/s 01'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇺🇸US_302|830KB/s|P002-260618 01'
      - '🇺🇸US_623|703KB/s|P002-260618 01'
      - '🇺🇸US_457|806KB/s|R002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:
      - '🇺🇸US_314|857KB/s|R002-260618 01'
rules:

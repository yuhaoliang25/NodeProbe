mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
  cn_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
proxies:
  - name: '🇫🇷FR_2058|2.0MB/s|R002-260618 01'
    port: 443
    server: '172.64.68.89'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    _poolOnly: true
  - name: '🇫🇷FR_2083|1.8MB/s|R002-260618 01'
    port: 443
    server: '172.64.69.89'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    _poolOnly: true
  - name: '🇫🇷FR_364|1.9MB/s|K001-260618 [9609525282db]'
    password: 'None'
    port: 443
    server: '82.66.235.221'
    skip-cert-verify: true
    sub_tag: 'K001-260618'
    tls: true
    type: 'http'
    username: ''
    udp: true
    _poolOnly: true
  - name: '🇮🇪IE_11|3.2MB/s|K001-260618 [ebe2b193bdbc]'
    password: 'None'
    port: 443
    server: '18.200.158.139'
    skip-cert-verify: true
    sub_tag: 'K001-260618'
    tls: true
    type: 'http'
    username: ''
    udp: true
    _poolOnly: true
  - name: '🇳🇱NL_244|3.5MB/s|R002-260618 01'
    password: 'null'
    port: 9002
    server: '84.17.47.149'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    username: 'null'
    udp: true
    _poolOnly: true
proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇫🇷FR_2058|2.0MB/s|R002-260618 01'
      - '🇫🇷FR_2083|1.8MB/s|R002-260618 01'
      - '🇫🇷FR_364|1.9MB/s|K001-260618 [9609525282db]'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇫🇷FR_2083|1.8MB/s|R002-260618 01'
      - '🇮🇪IE_11|3.2MB/s|K001-260618 [ebe2b193bdbc]'
      - '🇳🇱NL_244|3.5MB/s|R002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:
      - '🇫🇷FR_2058|2.0MB/s|R002-260618 01'
rules:
  - 'DOMAIN-SUFFIX,x.com,STICKY'
  - 'DOMAIN-SUFFIX,twitter.com,STICKY'
  - 'DOMAIN-SUFFIX,t.co,STICKY'
  - 'DOMAIN-SUFFIX,threads.com,STICKY'
  - 'DOMAIN-SUFFIX,threads.net,STICKY'
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaistatic.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
  - 'DOMAIN-SUFFIX,pokemonshowdown.com,DIRECT'
  - 'DOMAIN-SUFFIX,psim.us,DIRECT'
  - 'DOMAIN-SUFFIX,services.googleapis.cn,PROXY'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,cn_domain,DIRECT'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'RULE-SET,geolocation_not_cn,PROXY'
  - 'MATCH,PROXY'

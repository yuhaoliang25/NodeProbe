proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
      - '🇭🇰 香港 09'
      - '🇭🇰 香港 04'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇺🇸US_402|754KB/s|P002-260618 01'
      - '🇺🇸US_201|822KB/s|P002-260618 01'
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:

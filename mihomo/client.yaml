proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇷🇴RO_50|1.7MB/s|R002-260618 01'
      - '🇷🇴RO_77|720KB/s|R002-260618 01'
      - '🇷🇴RO_42|1.0MB/s 01'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇯🇵JP_41|290KB/s|R002-260618 01'
      - '🇺🇸US_623|703KB/s|P002-260618 01'
      - '🇺🇸US_297|497KB/s|P002-260618 01'
  - name: 'STICKY'
    type: 'select'
    proxies:
      - '🇯🇵JP_41|290KB/s|R002-260618 01'
rules:
  - 'DOMAIN-SUFFIX,x.com,STICKY'
  - 'DOMAIN-SUFFIX,twitter.com,STICKY'
  - 'DOMAIN-SUFFIX,t.co,STICKY'
  - 'DOMAIN-SUFFIX,threads.com,STICKY'
  - 'DOMAIN-SUFFIX,threads.net,STICKY'
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'

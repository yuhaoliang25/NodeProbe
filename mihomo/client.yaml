mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs'
  cn_ip:
    type: 'http'
    behavior: 'ipcidr'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs'
proxies:
  - name: '🇸🇬SG_38|247KB/s|R002-260618 01'
    port: 443
    server: '154.26.139.24'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: 'd1f4a0d80288cf0b'
  - name: '🇺🇸US_314|857KB/s|R002-260618 01'
    port: 9002
    server: '138.199.35.215'
    skip-cert-verify: true
    sub_tag: 'R002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '4e8e1c3187e3a404'
  - name: '🇺🇸US_305|801KB/s|P002-260618 01'
    password: 'None'
    port: 9002
    server: '138.199.35.215'
    skip-cert-verify: true
    sub_tag: 'P002-260618'
    tls: true
    type: 'http'
    udp: true
    endpoint-id: '4feaa498e6860bf5'
proxy-groups:
  - name: 'PROXY'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
      - '🇺🇸US_314|857KB/s|R002-260618 01'
      - '🇺🇸US_305|801KB/s|P002-260618 01'
      - 'DIRECT'
  - name: 'CHATGPT'
    type: 'select'
    proxies:
      - '🇸🇬SG_38|247KB/s|R002-260618 01'
      - '🇺🇸US_314|857KB/s|R002-260618 01'
      - '🇺🇸US_305|801KB/s|P002-260618 01'
rules:
  - 'DOMAIN-SUFFIX,chatgpt.com,CHATGPT'
  - 'DOMAIN-SUFFIX,chat.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,auth.openai.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaistatic.com,CHATGPT'
  - 'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
  - 'DOMAIN-SUFFIX,pokemonshowdown.com,DIRECT'
  - 'DOMAIN-SUFFIX,psim.us,DIRECT'
  - 'DOMAIN-SUFFIX,services.googleapis.cn,PROXY'
  - 'RULE-SET,private_domain,DIRECT'
  - 'RULE-SET,private_ip,DIRECT,no-resolve'
  - 'RULE-SET,cn_domain,DIRECT'
  - 'RULE-SET,cn_ip,DIRECT,no-resolve'
  - 'RULE-SET,geolocation_not_cn,PROXY'
  - 'MATCH,PROXY'

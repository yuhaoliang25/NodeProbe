mixed-port: 7890
allow-lan: false
mode: 'rule'
log-level: 'warning'
ipv6: false
rule-providers:
  private_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs'
  cn_domain:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs'
  geolocation_not_cn:
    type: 'http'
    behavior: 'domain'
    format: 'mrs'
    interval: 86400
    url: 'https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs'
  private_ip:

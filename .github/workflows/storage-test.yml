name: B2 Storage Test

on:
  workflow_dispatch:

jobs:
  test-b2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create test file
        run: |
          set -euo pipefail
          printf 'NodeProbe B2 official action test\n' > hello.txt

      - name: Upload with Backblaze official action
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: ./hello.txt
          destination: storage-test/hello.txt

      - name: Download with Backblaze official action
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: storage-test/hello.txt
          destination: ./downloaded.txt

      - name: Verify
        run: |
          set -euo pipefail
          cmp hello.txt downloaded.txt
          echo "B2 official action upload/download test passed."

      - name: Delete test object
        if: always()
        uses: backblaze-labs/b2-action@v1
        with:
          action: delete
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: storage-test/hello.txt

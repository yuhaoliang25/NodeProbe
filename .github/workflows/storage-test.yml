name: B2 Storage Test

on:
  workflow_dispatch:

jobs:
  test-b2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: us-east-005
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_BUCKET: nodeprobe
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Create test file
        run: |
          set -euo pipefail
          printf 'NodeProbe B2 connectivity test\n' > hello.txt

      - name: Configure AWS CLI for B2
        run: |
          set -euo pipefail
          aws configure set default.s3.signature_version s3v4
          aws --version
          aws configure list

      - name: Upload to B2
        run: |
          set -euo pipefail
          aws s3api put-object \
            --bucket "$B2_BUCKET" \
            --key storage-test/hello.txt \
            --body hello.txt \
            --endpoint-url "$B2_ENDPOINT"

      - name: Direct GET from B2
        run: |
          set -euo pipefail
          aws s3api get-object \
            --bucket "$B2_BUCKET" \
            --key storage-test/hello.txt \
            downloaded.txt \
            --endpoint-url "$B2_ENDPOINT"

      - name: Verify downloaded file
        run: |
          set -euo pipefail
          cmp hello.txt downloaded.txt
          echo "B2 upload/direct-download test passed."

      - name: Clean up test object
        if: always()
        continue-on-error: true
        run: |
          aws s3api delete-object \
            --bucket "$B2_BUCKET" \
            --key storage-test/hello.txt \
            --endpoint-url "$B2_ENDPOINT"

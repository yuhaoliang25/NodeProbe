name: Update free nodes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: nodeprobe-publish-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fast JavaScript checks
        run: npm run check && npm run lint
      - name: Restore persistent state from B2
        run: mkdir -p data

      - name: Restore sources.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/sources.json
          destination: data/sources.json

      - name: Restore discovery-state.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/discovery-state.json
          destination: data/discovery-state.json

      - name: Restore source-evolution.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/source-evolution.json
          destination: data/source-evolution.json

      - name: Restore source-history.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/source-history.json
          destination: data/source-history.json

      - name: Restore source-reputation.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/source-reputation.json
          destination: data/source-reputation.json

      - name: Restore node-pool.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/node-pool.json
          destination: data/node-pool.json

      - name: Restore history.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/history.json
          destination: data/history.json

      - name: Restore stability.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/stability.json
          destination: data/stability.json

      - name: Restore stability-history.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/stability-history.json
          destination: data/stability-history.json

      - name: Restore ip-geolocation.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/ip-geolocation.json
          destination: data/ip-geolocation.json


      - name: Restore country-pool.json from B2
        continue-on-error: true
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/country-pool.json
          destination: data/country-pool.json

      - name: Discover public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover
      - name: Fetch public sources
        run: npm run fetch
      - name: Build candidate subscription
        run: npm run build
      - name: Analyze source similarity
        run: npm run source-graph
      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$asset"
          mkdir -p mihomo
          curl -fsSL --retry 3 "$asset" -o mihomo/mihomo.gz
          gunzip -f mihomo/mihomo.gz
          chmod +x mihomo/mihomo
      - name: Generate Mihomo config
        run: |
          node - <<'NODE'
          const fs=require('fs'),yaml=require('js-yaml');
          const d=yaml.load(fs.readFileSync('subscriptions/all.yaml','utf8'));
          const p=d.proxies||[];
          const cfg=yaml.load(fs.readFileSync('mihomo/config-template.yaml','utf8'));
          cfg.proxies=p;
          cfg['proxy-groups'][0].proxies=p.map(x=>x.name);
          fs.mkdirSync('mihomo',{recursive:true});
          fs.writeFileSync('mihomo/config.yaml',yaml.dump(cfg,{lineWidth:-1,noRefs:true}));
          console.log('nodes:',p.length);
          NODE
      - name: Validate Mihomo config
        run: |
          set -euo pipefail
          if ! mihomo/mihomo -t -d mihomo -f mihomo/config.yaml > mihomo/config-test.log 2>&1; then
            cat mihomo/config-test.log
            exit 1
          fi
      - name: Start Mihomo
        run: |
          set -euo pipefail
          mihomo/mihomo -d mihomo -f mihomo/config.yaml > mihomo/mihomo.log 2>&1 &
          pid=$!
          echo "$pid" > mihomo/mihomo.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Mihomo exited during startup (attempt $i). Log:"
              cat mihomo/mihomo.log || true
              exit 1
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:9090/version > mihomo/version.json 2>/dev/null; then
              echo "Mihomo API is ready:"
              cat mihomo/version.json
              exit 0
            fi
            sleep 1
          done

          echo "Mihomo process is alive but API did not become ready. Log:"
          cat mihomo/mihomo.log || true
          exit 1
      - name: Multi-round Google health check
        env:
          TEST_ROUNDS: '3'
          TEST_TIMEOUT: '8000'
          FAST_TIMEOUT: '5000'
          STAGE2_LIMIT: '300'
          STAGE3_LIMIT: '100'
          TEST_BATCH_SIZE: '250'
          TEST_BATCH_PAUSE_MS: '500'
          TEST_CONCURRENCY: '24'
          TEST_EXPECTED: '204'
          GOOGLE_TEST_URL: https://www.google.com/generate_204
        run: node scripts/test-google.js
      - name: Diagnose failed nodes
        env:
          DIAG_LIMIT: '100'
          DIAG_TIMEOUT: '8000'
          GOOGLE_TEST_URL: https://www.google.com/generate_204
        run: node scripts/diagnose-failures.js
      - name: Detect node countries from server IPs
        env:
          GEO_MAX_NODES: '1000'
          GEO_CONCURRENCY: '6'
        run: npm run geo
      - name: Update persistent NodeProbe node pool
        run: npm run node-pool
      - name: Rebuild filtered subscriptions (provisional Best)
        run: node scripts/build-subscriptions.js
      - name: Confirm provisional Best stability
        env:
          STABILITY_ROUNDS: '5'
          STABILITY_ATTEMPTS_PER_TARGET: '10'
          STABILITY_TIMEOUT: '5000'
          STABILITY_CONCURRENCY: '12'
          STABILITY_ROUND_PAUSE_MS: '15000'
          STABILITY_MAX_NODES: '100'
          STABILITY_MIN_SUCCESS_RATE: '0.95'
          STABILITY_MIN_TARGET_SUCCESS_RATE: '0.8'
          STABILITY_MIN_ROUND_SUCCESS_RATE: '0.6666666667'
          STABILITY_MAX_CONSECUTIVE_FAILURES: '1'
          STABILITY_MAX_CONSECUTIVE_TIMEOUTS: '1'
          STABILITY_P95_LIMIT: '5000'
        run: npm run stability
      - name: Rebuild filtered subscriptions (final Best)
        run: node scripts/build-subscriptions.js
      - name: Convert final subscriptions to importable Mihomo configs
        run: node scripts/convert-subscriptions.js
      - name: Upload stability confirmation artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-stability-confirmation
          path: reports/stability/
          retention-days: 30
      - name: Generate best-node selection audit
        run: npm run best-audit

      - name: Upload best-node selection audit
        uses: actions/upload-artifact@v4
        with:
          name: best-selection-audit
          path: reports/best-audit/
          retention-days: 30

      - name: Generate node diagnostic index
        run: npm run node-index

      - name: Upload node diagnostic index
        uses: actions/upload-artifact@v4
        with:
          name: node-diagnostic-index
          path: reports/node-index/
          retention-days: 14

      - name: Save sources.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/sources.json
          destination: nodeprobe-state/sources.json

      - name: Save discovery-state.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/discovery-state.json
          destination: nodeprobe-state/discovery-state.json

      - name: Save source-evolution.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/source-evolution.json
          destination: nodeprobe-state/source-evolution.json

      - name: Save source-history.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/source-history.json
          destination: nodeprobe-state/source-history.json

      - name: Save source-reputation.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/source-reputation.json
          destination: nodeprobe-state/source-reputation.json

      - name: Save node-pool.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/node-pool.json
          destination: nodeprobe-state/node-pool.json

      - name: Save history.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/history.json
          destination: nodeprobe-state/history.json

      - name: Save stability.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/stability.json
          destination: nodeprobe-state/stability.json

      - name: Save stability-history.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/stability-history.json
          destination: nodeprobe-state/stability-history.json

      - name: Save ip-geolocation.json to B2
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/ip-geolocation.json
          destination: nodeprobe-state/ip-geolocation.json

      - name: Save country-pool.json to B2

        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: data/country-pool.json
          destination: nodeprobe-state/country-pool.json

      - name: Publish Global Stable to B2 for China
        if: success()
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: subscriptions/stable.yaml
          destination: nodeprobe-state/china/stable.yaml

      - name: Commit generated subscriptions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add subscriptions mihomo/*.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh node candidates"

          # The workflow may run while main is being updated manually.
          # Rebase the generated commit onto the latest main before pushing.
          # This keeps unrelated manual commits and avoids a stale-checkout push race.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Push raced with a newer main commit; retrying..."
              sleep 3
            fi
          done

          echo "Failed to push generated subscriptions after 3 attempts."
          exit 1

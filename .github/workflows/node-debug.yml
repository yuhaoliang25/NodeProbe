name: Debug selected nodes

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Optional node names, one per line. If empty, use debug/targets.txt."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Restore diagnostic state from B2
        run: mkdir -p data
      - name: Restore history.json
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/history.json
          destination: data/history.json
      - name: Restore reputation.json
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/reputation.json
          destination: data/reputation.json
      - name: Restore node-pool.json
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/node-pool.json
          destination: data/node-pool.json
      - name: Restore source-reputation.json
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/source-reputation.json
          destination: data/source-reputation.json
      - name: Restore scores.json
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/scores.json
          destination: data/scores.json
      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9][^-]*\\.gz$")) | .browser_download_url' | head -1)
          test -n "$asset"
          mkdir -p mihomo
          curl -fsSL --retry 3 "$asset" -o mihomo/mihomo.gz
          gunzip -f mihomo/mihomo.gz
          chmod +x mihomo/mihomo
      - name: Prepare selected-node debug config
        env:
          DEBUG_TARGETS: ${{ inputs.targets }}
        run: node scripts/debug-selected-nodes.js --prepare
      - name: Validate Mihomo debug config
        run: |
          set -euo pipefail
          mihomo/mihomo -t -d mihomo -f mihomo/debug-config.yaml > mihomo/debug-config-test.log 2>&1 || { cat mihomo/debug-config-test.log; exit 1; }
      - name: Start Mihomo debug instance
        run: |
          set -euo pipefail
          mihomo/mihomo -d mihomo -f mihomo/debug-config.yaml > mihomo/debug-mihomo.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then cat mihomo/debug-mihomo.log || true; exit 1; fi
            if curl -fsS --max-time 2 http://127.0.0.1:9090/version > mihomo/debug-version.json 2>/dev/null; then cat mihomo/debug-version.json; exit 0; fi
            sleep 1
          done
          cat mihomo/debug-mihomo.log || true
          exit 1
      - name: Run targeted node diagnostics
        env:
          DEBUG_TARGETS: ${{ inputs.targets }}
          DEBUG_ROUNDS: "5"
          MIHOMO_API: "http://127.0.0.1:9090"
        run: node scripts/debug-selected-nodes.js
      - name: Upload targeted debug report
        uses: actions/upload-artifact@v4
        with:
          name: node-debug-${{ github.run_id }}
          path: |
            reports/node-debug/
            mihomo/debug-config-test.log
            mihomo/debug-mihomo.log
            mihomo/debug-version.json
          retention-days: 30
      - name: Print report summary
        run: cat reports/node-debug/node-debug.md

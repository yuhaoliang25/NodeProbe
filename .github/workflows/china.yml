name: Publish China results

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: nodeprobe-publish-main
  cancel-in-progress: false

jobs:
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest China release manifest
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/release.json
          destination: data/china-release.json

      - name: Pull China diagnostics
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-diagnostics.json
          destination: data/china-diagnostics.json

      - name: Pull China exit pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/exit.yaml
          destination: subscriptions/exit.yaml

      - name: Pull China ChatGPT subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/chatgpt.yaml
          destination: subscriptions/chatgpt.yaml

      - name: Pull China sticky subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/sticky.yaml
          destination: subscriptions/sticky.yaml

      - name: Pull China elite subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/elite.yaml
          destination: subscriptions/elite.yaml

      - name: Pull China elite metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-elite.json
          destination: subscriptions/china-elite.json

      - name: Pull China pair pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/pairs.yaml
          destination: subscriptions/pairs.yaml

      - name: Pull China pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pools.json
          destination: subscriptions/china-pools.json

      - name: Pull China pair pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pair-pool.json
          destination: subscriptions/china-pair-pool.json

      - name: Verify China release consistency
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const manifestText = fs.readFileSync('data/china-release.json', 'utf8');
          let manifest;
          try {
            manifest = JSON.parse(manifestText);
          } catch (error) {
            // Older China machines accidentally wrote a literal "\\n" after
            // the closing JSON brace. Accept that legacy artifact temporarily;
            // new releases must still be valid JSON.
            const repaired = manifestText.replace(/\\n\\s*$/, '');
            if (repaired === manifestText) throw error;
            manifest = JSON.parse(repaired);
            console.warn('Accepted legacy China release manifest with literal \\n suffix.');
          }
          if (manifest.version < 2 || !Array.isArray(manifest.files)) {
            throw new Error('China release manifest is missing per-file hashes (version 2 required)');
          }

          const checks = [
            ['nodeprobe-state/china/exit.yaml', 'subscriptions/exit.yaml'],
            ['nodeprobe-state/china/elite.yaml', 'subscriptions/elite.yaml'],
            ['nodeprobe-state/china/chatgpt.yaml', 'subscriptions/chatgpt.yaml'],
            ['nodeprobe-state/china/sticky.yaml', 'subscriptions/sticky.yaml'],
            ['nodeprobe-state/china/china-elite.json', 'subscriptions/china-elite.json'],
            ['nodeprobe-state/china/pairs.yaml', 'subscriptions/pairs.yaml'],
            ['nodeprobe-state/china/china-pools.json', 'subscriptions/china-pools.json'],
            ['nodeprobe-state/china/china-pair-pool.json', 'subscriptions/china-pair-pool.json']
          ];

          const byRemote = new Map(manifest.files.map(f => [f.remote, f]));
          for (const [remote, local] of checks) {
            const entry = byRemote.get(remote);
            if (!entry || !entry.sha256) {
              throw new Error('China release manifest missing hash for: ' + remote);
            }
            const bytes = fs.readFileSync(local);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sha256 !== entry.sha256) {
              throw new Error(
                'China release consistency check failed for ' + remote +
                ': expected ' + entry.sha256 + ', got ' + sha256
              );
            }
            if (bytes.length !== entry.size) {
              throw new Error(
                'China release size check failed for ' + remote +
                ': expected ' + entry.size + ', got ' + bytes.length
              );
            }
          }

          console.log(
            'Verified China release ' + (manifest.releaseId || '(no releaseId)') +
            ': ' + checks.length + ' downloaded files match manifest hashes.'
          );
          NODE

      - name: Generate and structurally validate client config
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run client-config

          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');

          const file = 'mihomo/client.yaml';
          const doc = yaml.load(fs.readFileSync(file, 'utf8'));

          function requireObject(value, label) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              throw new Error('Invalid client config: ' + label + ' must be a mapping');
            }
          }
          function requireArray(value, label) {
            if (!Array.isArray(value)) {
              throw new Error('Invalid client config: ' + label + ' must be an array');
            }
          }

          requireObject(doc, 'root');
          for (const key of ['mixed-port', 'mode', 'proxies', 'proxy-groups', 'rules', 'rule-providers']) {
            if (!(key in doc)) throw new Error('Invalid client config: missing ' + key);
          }
          if (!Number.isInteger(doc['mixed-port']) || doc['mixed-port'] < 1 || doc['mixed-port'] > 65535) {
            throw new Error('Invalid client config: mixed-port must be a valid TCP/UDP port number');
          }
          requireArray(doc.proxies, 'proxies');
          requireArray(doc['proxy-groups'], 'proxy-groups');
          requireArray(doc.rules, 'rules');
          requireObject(doc['rule-providers'], 'rule-providers');
          if (doc.rules.length === 0) throw new Error('Invalid client config: rules must not be empty');

          const proxyNames = new Set();
          for (const [i, proxy] of doc.proxies.entries()) {
            requireObject(proxy, 'proxies[' + i + ']');
            if (typeof proxy.name !== 'string' || !proxy.name.trim()) {
              throw new Error('Invalid client config: proxies[' + i + '] has no name');
            }
            if (proxyNames.has(proxy.name)) {
              throw new Error('Invalid client config: duplicate proxy name ' + proxy.name);
            }
            proxyNames.add(proxy.name);
            if (typeof proxy.type !== 'string' || !proxy.type.trim()) {
              throw new Error('Invalid client config: proxy ' + proxy.name + ' has no type');
            }
          }

          const groupNames = new Set();
          const groups = new Map();
          for (const [i, group] of doc['proxy-groups'].entries()) {
            requireObject(group, 'proxy-groups[' + i + ']');
            if (typeof group.name !== 'string' || !group.name.trim()) {
              throw new Error('Invalid client config: proxy-groups[' + i + '] has no name');
            }
            if (groupNames.has(group.name)) {
              throw new Error('Invalid client config: duplicate proxy group ' + group.name);
            }
            groupNames.add(group.name);
            if (typeof group.type !== 'string' || !group.type.trim()) {
              throw new Error('Invalid client config: proxy group ' + group.name + ' has no type');
            }
            requireArray(group.proxies, 'proxy group ' + group.name + '.proxies');
            groups.set(group.name, group);
          }

          const builtins = new Set(['DIRECT', 'REJECT', 'REJECT-DROP', 'PASS', 'COMPATIBLE']);
          for (const [name, group] of groups) {
            if (group.proxies.length === 0) {
              throw new Error('Invalid client config: proxy group ' + name + ' has no members');
            }
            for (const member of group.proxies) {
              if (typeof member !== 'string' ||
                  (!proxyNames.has(member) && !groupNames.has(member) && !builtins.has(member))) {
                throw new Error('Invalid client config: proxy group ' + name + ' references unknown member ' + member);
              }
            }
          }

          for (const [name, provider] of Object.entries(doc['rule-providers'])) {
            requireObject(provider, 'rule-provider ' + name);
            if (!provider.type || !provider.behavior || !provider.url) {
              throw new Error('Invalid client config: rule-provider ' + name + ' is missing type/behavior/url');
            }
          }

          for (const [i, rule] of doc.rules.entries()) {
            if (typeof rule !== 'string' || !rule.trim()) {
              throw new Error('Invalid client config: rules[' + i + '] must be a non-empty string');
            }
            const parts = rule.split(',');
            const kind = parts[0];
            const target = parts[parts.length - 1];
            if (kind === 'RULE-SET') {
              const providerName = parts[1];
              if (!providerName || !Object.prototype.hasOwnProperty.call(doc['rule-providers'], providerName)) {
                throw new Error('Invalid client config: rule references unknown rule-provider: ' + rule);
              }
            }
            if (kind !== 'MATCH' && !kind) {
              throw new Error('Invalid client config: malformed rule: ' + rule);
            }
            if (target && !builtins.has(target) && !proxyNames.has(target) && !groupNames.has(target)) {
              throw new Error('Invalid client config: rule references unknown policy/group: ' + rule);
            }
          }

          console.log(
            'Client config structurally valid: proxies=' + doc.proxies.length +
            ', groups=' + doc['proxy-groups'].length +
            ', ruleProviders=' + Object.keys(doc['rule-providers']).length +
            ', rules=' + doc.rules.length
          );
          NODE

      - name: Upload China diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-diagnostics-${{ github.run_id }}
          path: |
            data/*diagnostic*.json
            data/*diagnostics*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish China subscriptions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add subscriptions/exit.yaml subscriptions/elite.yaml subscriptions/chatgpt.yaml subscriptions/sticky.yaml subscriptions/china-elite.json subscriptions/pairs.yaml subscriptions/china-pools.json subscriptions/china-pair-pool.json mihomo/client.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish China subscriptions"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push raced with a newer main commit; retrying..."
              sleep 3
            fi
          done

          echo "Failed to publish China subscriptions after 3 attempts."
          exit 1

name: Publish China results

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: nodeprobe-publish-main
  cancel-in-progress: false

jobs:
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest China release manifest
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/release.json
          destination: data/china-release.json

      - name: Pull China exit pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/exit.yaml
          destination: subscriptions/exit.yaml

      - name: Pull China pair pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/pairs.yaml
          destination: subscriptions/pairs.yaml

      - name: Pull China pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pools.json
          destination: subscriptions/china-pools.json

      - name: Pull China pair pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pair-pool.json
          destination: subscriptions/china-pair-pool.json

      - name: Pull China client config
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/client.yaml
          destination: mihomo/client.yaml

      - name: Publish China subscriptions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add subscriptions/exit.yaml subscriptions/pairs.yaml subscriptions/china-pools.json subscriptions/china-pair-pool.json mihomo/client.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish China subscriptions"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push raced with a newer main commit; retrying..."
              sleep 3
            fi
          done

          echo "Failed to publish China subscriptions after 3 attempts."
          exit 1

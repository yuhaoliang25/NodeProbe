name: Publish China results

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: write

concurrency:
  group: nodeprobe-publish-main
  cancel-in-progress: false

jobs:
  china:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest China release manifest
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/release.json
          destination: data/china-release.json

      - name: Pull China exit pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/exit.yaml
          destination: subscriptions/exit.yaml

      - name: Pull China ChatGPT subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/chatgpt.yaml
          destination: subscriptions/chatgpt.yaml

      - name: Pull China sticky subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/sticky.yaml
          destination: subscriptions/sticky.yaml

      - name: Pull China elite subscription
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/elite.yaml
          destination: subscriptions/elite.yaml

      - name: Pull China elite metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-elite.json
          destination: subscriptions/china-elite.json

      - name: Pull China pair pool
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/pairs.yaml
          destination: subscriptions/pairs.yaml

      - name: Pull China pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pools.json
          destination: subscriptions/china-pools.json

      - name: Pull China pair pool metadata
        uses: backblaze-labs/b2-action@v1
        with:
          action: download
          application-key-id: ${{ secrets.B2_APPLICATION_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: nodeprobe
          source: nodeprobe-state/china/china-pair-pool.json
          destination: subscriptions/china-pair-pool.json

      - name: Verify China release consistency
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const manifest = JSON.parse(fs.readFileSync('data/china-release.json', 'utf8'));
          if (manifest.version < 2 || !Array.isArray(manifest.files)) {
            throw new Error('China release manifest is missing per-file hashes (version 2 required)');
          }

          const checks = [
            ['nodeprobe-state/china/exit.yaml', 'subscriptions/exit.yaml'],
            ['nodeprobe-state/china/elite.yaml', 'subscriptions/elite.yaml'],
            ['nodeprobe-state/china/chatgpt.yaml', 'subscriptions/chatgpt.yaml'],
            ['nodeprobe-state/china/sticky.yaml', 'subscriptions/sticky.yaml'],
            ['nodeprobe-state/china/china-elite.json', 'subscriptions/china-elite.json'],
            ['nodeprobe-state/china/pairs.yaml', 'subscriptions/pairs.yaml'],
            ['nodeprobe-state/china/china-pools.json', 'subscriptions/china-pools.json'],
            ['nodeprobe-state/china/china-pair-pool.json', 'subscriptions/china-pair-pool.json']
          ];

          const byRemote = new Map(manifest.files.map(f => [f.remote, f]));
          for (const [remote, local] of checks) {
            const entry = byRemote.get(remote);
            if (!entry || !entry.sha256) {
              throw new Error('China release manifest missing hash for: ' + remote);
            }
            const bytes = fs.readFileSync(local);
            const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            if (sha256 !== entry.sha256) {
              throw new Error(
                'China release consistency check failed for ' + remote +
                ': expected ' + entry.sha256 + ', got ' + sha256
              );
            }
            if (bytes.length !== entry.size) {
              throw new Error(
                'China release size check failed for ' + remote +
                ': expected ' + entry.size + ', got ' + bytes.length
              );
            }
          }

          console.log(
            'Verified China release ' + (manifest.releaseId || '(no releaseId)') +
            ': ' + checks.length + ' downloaded files match manifest hashes.'
          );
          NODE

      - name: Generate client config from published China subscriptions
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run client-config

          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');

          function loadProxies(file) {
            const doc = yaml.load(fs.readFileSync(file, 'utf8'));
            return Array.isArray(doc?.proxies) ? doc.proxies.filter(p => p && p.name) : [];
          }

          const file = 'mihomo/client.yaml';
          const doc = yaml.load(fs.readFileSync(file, 'utf8'));
          const sticky = loadProxies('subscriptions/sticky.yaml');
          const chatgpt = loadProxies('subscriptions/chatgpt.yaml');

          if (!doc || !Array.isArray(doc.rules)) {
            throw new Error('Generated client.yaml has no rules array');
          }

          const required = [
            'RULE-SET,cn_domain,DIRECT',
            'RULE-SET,cn_ip,DIRECT,no-resolve',
            'MATCH,PROXY'
          ];

          for (const rule of required) {
            if (!doc.rules.includes(rule)) {
              throw new Error('Generated client.yaml missing required base rule: ' + rule);
            }
          }

          for (const name of ['cn_domain', 'cn_ip', 'private_domain', 'private_ip']) {
            if (!doc['rule-providers'] || !doc['rule-providers'][name]) {
              throw new Error('Generated client.yaml missing rule-provider: ' + name);
            }
          }

          if (sticky.length) {
            for (const rule of [
              'DOMAIN-SUFFIX,x.com,STICKY',
              'DOMAIN-SUFFIX,twitter.com,STICKY',
              'DOMAIN-SUFFIX,t.co,STICKY',
              'DOMAIN-SUFFIX,threads.com,STICKY',
              'DOMAIN-SUFFIX,threads.net,STICKY'
            ]) {
              if (!doc.rules.includes(rule)) {
                throw new Error('Generated client.yaml missing sticky rule: ' + rule);
              }
            }
            console.log('Validated X/Threads sticky policy: sticky proxies=' + sticky.length);
          } else {
            console.log('China sticky subscription is empty; X/Threads sticky rules are intentionally omitted for this publication.');
          }

          if (chatgpt.length) {
            for (const rule of [
              'DOMAIN-SUFFIX,chatgpt.com,CHATGPT',
              'DOMAIN-SUFFIX,chat.openai.com,CHATGPT',
              'DOMAIN-SUFFIX,auth.openai.com,CHATGPT',
              'DOMAIN-SUFFIX,oaistatic.com,CHATGPT',
              'DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT'
            ]) {
              if (!doc.rules.includes(rule)) {
                throw new Error('Generated client.yaml missing ChatGPT rule: ' + rule);
              }
            }
            console.log('Validated ChatGPT anti-risk policy: chatgpt proxies=' + chatgpt.length);
          } else {
            console.log('China ChatGPT subscription is empty; ChatGPT-specific rules are intentionally omitted for this publication.');
          }

          console.log('Validated China client policy: CN DIRECT + proxy fallback');
          NODE

      - name: Publish China subscriptions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add subscriptions/exit.yaml subscriptions/elite.yaml subscriptions/chatgpt.yaml subscriptions/sticky.yaml subscriptions/china-elite.json subscriptions/pairs.yaml subscriptions/china-pools.json subscriptions/china-pair-pool.json mihomo/client.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish China subscriptions"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push raced with a newer main commit; retrying..."
              sleep 3
            fi
          done

          echo "Failed to publish China subscriptions after 3 attempts."
          exit 1

name: B2 Lifecycle Diagnostic v2

on:
  push:
    branches:
      - b2-lifecycle-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B2_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: nodeprobe
      B2_TARGET_FILE: nodeprobe-state/china-node-assets.json
    steps:
      - name: Inspect bucket lifecycle and target object versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          from datetime import datetime, timezone

          key_id, app_key = os.environ["B2_KEY_ID"], os.environ["B2_APPLICATION_KEY"]
          bucket_name, target = os.environ["B2_BUCKET"], os.environ["B2_TARGET_FILE"]

          def post(url, token, payload):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                  headers={"Authorization": token, "Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f"B2 API HTTP {exc.code}: {exc.read().decode(errors='replace')[:1000]}")

          basic = base64.b64encode(f"{key_id}:{app_key}".encode()).decode()
          req = urllib.request.Request("https://api.backblazeb2.com/b2api/v2/b2_authorize_account",
              headers={"Authorization": f"Basic {basic}"})
          with urllib.request.urlopen(req, timeout=30) as response:
              auth = json.load(response)
          api, token = auth["apiUrl"], auth["authorizationToken"]
          buckets = post(api + "/b2api/v2/b2_list_buckets", token, {"accountId": auth["accountId"]})
          bucket = next((b for b in buckets.get("buckets", []) if b["bucketName"] == bucket_name), None)
          if not bucket:
              raise SystemExit(f"ERROR: bucket {bucket_name!r} not visible to this key")
          print(f"BUCKET: {bucket_name}")
          print("LIFECYCLE_RULES:")
          print(json.dumps(bucket.get("lifecycleRules", []), indent=2, sort_keys=True))

          versions, start_name, start_id = [], target, None
          while True:
              payload = {"bucketId": bucket["bucketId"], "startFileName": start_name, "maxFileCount": 1000}
              if start_id:
                  payload["startFileId"] = start_id
              page = post(api + "/b2api/v2/b2_list_file_versions", token, payload)
              versions.extend(f for f in page.get("files", []) if f.get("fileName") == target)
              next_name, next_id = page.get("nextFileName"), page.get("nextFileId")
              if not next_name or next_name != target:
                  break
              if not next_id or (next_name == start_name and next_id == start_id):
                  raise RuntimeError("B2 pagination did not advance")
              start_name, start_id = next_name, next_id

          versions.sort(key=lambda f: f.get("uploadTimestamp", 0), reverse=True)
          now = datetime.now(timezone.utc)
          print(f"\nTARGET: {target}")
          print(f"EXACT_VERSION_COUNT: {len(versions)}")
          locked = older24 = 0
          for item in versions:
              uploaded = datetime.fromtimestamp(item.get("uploadTimestamp", 0) / 1000, timezone.utc)
              retention, legal_hold = item.get("fileRetention"), item.get("legalHold")
              is_locked = bool(legal_hold == "on" or (retention and retention.get("mode") not in (None, "none")))
              locked += int(is_locked)
              older24 += int((now - uploaded).total_seconds() > 86400)
              print(json.dumps({
                  "action": item.get("action"), "uploadedUtc": uploaded.isoformat(),
                  "ageHours": round((now - uploaded).total_seconds()/3600, 2),
                  "fileId": item.get("fileId"), "contentLength": item.get("contentLength"),
                  "fileRetention": retention, "legalHold": legal_hold, "locked": is_locked
              }, sort_keys=True))
          print(f"LOCKED_VERSION_COUNT: {locked}")
          print(f"OLDER_THAN_24H: {older24}")
          PY
